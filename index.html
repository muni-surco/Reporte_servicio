<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surco - Sistema de Seguridad Ciudadana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#005ea5',
                            dark: '#003D6B',
                            light: '#E6EEF5',
                        },
                        secondary: {
                            DEFAULT: '#00C9A7',
                            dark: '#00A88A',
                        },
                        accent: '#F5A623',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
    <style>
        lord-icon {
            display: inline-block;
            width: 100%;
            height: 100%;
        }

        :root {
            /* Brand */
            --color-primary: #005ea5;
            --color-primary-dark: #003D6B;
            --color-primary-light: #E6EEF5;
            --color-secondary: #00C9A7;
            --color-secondary-dark: #00A88A;
            --color-accent: #F5A623;

            /* Surco - Map to Brand */
            --surco-blue: var(--color-primary);
            --surco-teal: var(--color-secondary);
            --surco-navy: var(--color-primary-dark);
        }

        body {
            font-family: 'Chivo', sans-serif;
            background-color: #f1f5f9;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .font-black {
            font-weight: 600 !important;
        }

        .font-extrabold {
            font-weight: 600 !important;
        }

        .font-bold {
            font-weight: 600 !important;
        }

        /* Utility classes for Surco Colors */
        .bg-surco-blue {
            background-color: var(--surco-blue);
        }

        .text-surco-blue {
            color: var(--surco-blue);
        }

        .border-surco-blue {
            border-color: var(--surco-blue);
        }

        .bg-surco-teal {
            background-color: var(--surco-teal);
        }

        .text-surco-teal {
            color: var(--surco-teal);
        }

        .bg-surco-navy {
            background-color: var(--surco-navy);
        }

        .border-left-chofer {
            border-left: 5px solid var(--color-primary) !important;
        }

        /* Print styles */
        @media print {

            aside,
            footer,
            button,
            .no-print,
            select {
                display: none !important;
            }

            main {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
            }

            .overflow-y-auto {
                overflow: visible !important;
                height: auto !important;
            }

            #report-content {
                padding: 0 !important;
            }

            body,
            main,
            #root,
            #report-content {
                background: white !important;
            }
        }
    </style>
</head>

<body class="antialiased text-slate-900 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
