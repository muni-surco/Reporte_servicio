
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surco - Sistema de Seguridad Ciudadana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        :root {
            --surco-blue: #004b93;
            --surco-teal: #00a19b;
            --surco-navy: #002d5a;
        }
        body {
            font-family: 'Chivo', sans-serif;
            background-color: #f1f5f9;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .font-black { font-weight: 600 !important; }
        .font-extrabold { font-weight: 600 !important; }
        .font-bold { font-weight: 600 !important; }
        
        /* Utility classes for Surco Colors */
        .bg-surco-blue { background-color: var(--surco-blue); }
        .text-surco-blue { color: var(--surco-blue); }
        .border-surco-blue { border-color: var(--surco-blue); }
        .bg-surco-teal { background-color: var(--surco-teal); }
        .text-surco-teal { color: var(--surco-teal); }
        .bg-surco-navy { background-color: var(--surco-navy); }
        .border-left-chofer {border-left: 5px solid #004b93 !important;}
    </style>

</head>
